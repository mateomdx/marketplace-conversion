; Copiar como config.ini FUERA del repositorio y completar.
; config.ini esta en .gitignore: NUNCA lo commitees.

[pegasus]
host     = SERVIDOR-PEGASUS
port     = 1433
database = pegasus
; Usuario de SOLO LECTURA. El script unicamente hace SELECT.
user     = odoo_readonly
password =

[odoo]
; URL saliente desde la red local. No hace falta abrir ningun puerto.
url      = https://marketplace.odoo.com
database = marketplace
; API key del usuario tecnico (Preferencias -> Seguridad de la cuenta ->
; Nueva clave de API). Se manda como Bearer token.
api_key  =

[sync]
; Ventana en dias que se le pide a PEGASUS.
window_days = 30
; Donde se deja el reporte de no coincidentes de cada corrida.
report_dir  = ./reportes
